apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: api
  description: The Hono MCP server (Streamable HTTP at /mcp, a plain Cloudflare Worker, per environment)
spec:
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `api`: a domain and a component share one name space in the
  # catalog, and a domain called `api` would take this component's place in
  # it — the API missing from its own catalog.
  domain: app
  path: apps/api
  # No dependsOn: the API reads no wiring and binds nothing, so there is no
  # infra component to deploy before it. A component under infra/ that this
  # Worker comes to read wiring from goes here, `mode: enforced` on
  # github-push-main and advisory on pull requests, so one convergence applies
  # it first.
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/api"
    # Committed, not rendered: the Worker binds nothing, so there are no
    # resource IDs to wire, and the lanes' structure check (`test -f`, before
    # any build) finds it in a fresh checkout. Per-env names come from `--env`:
    # hono-mcp-api-{stage,prod}.
    wranglerConfig: wrangler.jsonc

    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@app/api
    typecheckCommand: pnpm exec turbo run typecheck --filter=@app/api

    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod

    preDeployCommand: "echo 'No pre-deploy step configured.'"
    migrationCommand: "echo 'No migrations configured.'"
    # Smoke: /health answers `"status":"ok"` for THIS environment — the
    # environment comes from the `env.<name>` vars the deploy used, so a stale
    # or wrong Worker fails it — and then the MCP server itself: an
    # `initialize` over Streamable HTTP must come back with the server's
    # identity, and a `tools/call` of `add` with its sum. Not the server's
    # name, which is the owner's to change. The Worker composition exports no
    # deployed URL, so the command names its own workers.dev URL;
    # ${DEPLOYED_URL} overrides it (a custom domain, or a local `wrangler
    # dev`). ${ORUN_ENVIRONMENT} the runner sets for every step. Each body is
    # buffered before grep so an early match cannot SIGPIPE curl.
    smokeCommand: 'base="${DEPLOYED_URL:-https://hono-mcp-api-${ORUN_ENVIRONMENT}.your-workers-subdomain.workers.dev}" && health="$(curl -sf --max-time 20 "${base}/health")" && echo "${health}" | grep -q "\"status\":\"ok\"" && echo "${health}" | grep -q "\"environment\":\"${ORUN_ENVIRONMENT}\"" && init="$(curl -sf --max-time 20 -X POST "${base}/mcp" -H "content-type: application/json" -H "accept: application/json, text/event-stream" -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-06-18\",\"capabilities\":{},\"clientInfo\":{\"name\":\"orun-smoke\",\"version\":\"1\"}}}")" && echo "${init}" | grep -q "\"serverInfo\"" && sum="$(curl -sf --max-time 20 -X POST "${base}/mcp" -H "content-type: application/json" -H "accept: application/json, text/event-stream" -d "{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"add\",\"arguments\":{\"a\":2,\"b\":3}}}")" && echo "${sum}" | grep -q "2 + 3 = 5"'
  labels:
    team: platform
    layer: runtime
    surface: api
    runtime: cloudflare
